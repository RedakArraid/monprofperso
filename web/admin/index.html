<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administration, Mon Prof Perso</title>
  <link rel="icon" href="../assets/mp2-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css?v=20260706s" />
</head>
<body>

  <!-- ============================ CONNEXION ============================ -->
  <div id="login" class="login">
    <form class="login-card" id="loginForm">
      <img src="../assets/mp2-logo.png" alt="Logo MP²" class="login-logo" />
      <h1>Espace administrateur</h1>
      <p class="login-sub">Connectez-vous pour gérer la plateforme Mon Prof Perso.</p>
      <label for="phone">Numéro administrateur</label>
      <input id="phone" type="tel" inputmode="tel" placeholder="+22507…" autocomplete="username" required />
      <div id="loginChannelFields">
        <label for="loginChannel">Recevoir le code</label>
        <select id="loginChannel"><option value="whatsapp">WhatsApp</option><option value="email">E-mail vérifié</option></select>
        <div id="loginEmailField" hidden><label for="loginEmail">E-mail vérifié du compte</label><input id="loginEmail" type="email" autocomplete="email" /></div>
      </div>
      <div id="otpFields" hidden>
        <p id="otpDestination" class="login-sub"></p>
        <label for="loginOtp">Code de vérification</label>
        <input id="loginOtp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" disabled />
        <p id="otpExpiry" class="login-hint"></p>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Se connecter</button>
      <p class="login-err" id="loginErr" hidden></p>
      <div id="otpActions" hidden>
        <button type="button" class="btn" id="resendOtpBtn">Renvoyer le code</button>
        <button type="button" class="btn" id="resetOtpBtn">Changer de numéro</button>
      </div>
    </form>
  </div>

  <!-- ============================ APPLICATION ============================ -->
  <div id="app" class="app" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="../assets/mp2-logo.png" alt="Logo MP²" />
        <div><strong>Mon Prof Perso</strong><span>Administration</span></div>
      </div>
      <nav class="menu" id="menu">
        <button class="menu-item active" data-view="dashboard">Tableau de bord</button>
        <button class="menu-item" data-view="applications">Candidatures profs</button>
        <button class="menu-item" data-view="needs">Besoins parents</button>
        <button class="menu-item" data-view="teachers">Professeurs</button>
        <button class="menu-item" data-view="courses">Suivi des cours</button>
        <button class="menu-item" data-view="finance">Paiements et reversements</button>
        <button class="menu-item" data-view="deletions">Suppressions de comptes</button>
        <button class="menu-item" data-view="readiness">Mise en service</button>
        <button class="menu-item" data-view="groups" data-capability="groups" hidden>Cours de groupe</button>
        <button class="menu-item" data-view="catalog">Matières &amp; niveaux</button>
        <button class="menu-item" data-view="resources">Ressources</button>
        <button class="menu-item" data-view="legal">Documents légaux</button>
        <button class="menu-item" data-view="social">Réseaux &amp; contact</button>
        <button class="menu-item" data-view="otp">Vérification OTP</button>
      </nav>
      <div class="sidebar-foot">
        <a href="../index.html" class="link-quiet">← Voir le site</a>
        <a href="/espace/#/parametres" class="link-quiet" id="myAccountSettings">Mes données / mon compte</a>
        <button class="link-quiet" id="reauthBtn">Vérifier à nouveau mon identité</button>
        <button class="link-quiet" id="logoutBtn">Se déconnecter</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <h2 id="viewTitle">Tableau de bord</h2>
        <span class="who" id="who"></span>
      </header>
      <div class="content" id="content"><!-- injecté par admin.js --></div>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    // Toujours same-origin en prod (proxy nginx /api), même si un ancien admin.js est en cache.
    window.MPP_API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://localhost:8099"
      : location.origin;
  </script>
  <script src="js/operations.js?v=20261024-production"></script>
  <script src="js/admin.js?v=20261024-production"></script>
</body>
</html>
