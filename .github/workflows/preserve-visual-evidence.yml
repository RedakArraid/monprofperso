name: Preserve Android visual evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/preserve-visual-evidence.yml
      - scripts/visual/preserve-android-evidence.py

permissions:
  contents: read
  actions: read

concurrency:
  group: preserve-android-evidence-5
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.event.pull_request.number == 5 &&
      github.event.pull_request.head.ref == 'fix/visual-mobile-polish' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Evidence (${{ matrix.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        key:
          - inscription
          - otp-clavier
          - accueil-parent
          - accueil-parent-200
          - reservation
          - tableau-professeur-200
          - ressources-vides
          - ressources-indisponibles
          - bienvenue-paysage
          - manifest
          - readme
          - validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the immutable reviewed Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 90s gh api --method GET repos/RedakArraid/monprofperso/actions/artifacts/12850431280 > "$RUNNER_TEMP/mpp-evidence-metadata.json"
          timeout 90s gh api --method GET repos/RedakArraid/monprofperso/actions/artifacts/12850431280/zip > "$RUNNER_TEMP/mpp-evidence.zip"
      - name: Verify original bytes and emit one bounded evidence record
        env:
          EVIDENCE_KEY: ${{ matrix.key }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/visual/preserve-android-evidence.py
